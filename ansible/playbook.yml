- name: Inspect deployment host
  hosts: all

  tasks:
    - name: Check Ansible connectivity
      ansible.builtin.ping:

    - name: Show remote hostname
      ansible.builtin.debug:
        msg: 'Connected to {{ ansible_facts["hostname"] }}'

    - name: Check privilege escalation
      ansible.builtin.command: whoami
      become: true
      register: privilege_escalation_check
      changed_when: false

    - name: Detect Docker installation
      ansible.builtin.include_role:
        name: docker

    - name: Prepare Hermes host layout
      ansible.builtin.include_role:
        name: hermes_layout

    - name: Resolve Hermes runtime identity
      ansible.builtin.include_role:
        name: hermes_runtime

    - name: Deploy Hermes runtime
      ansible.builtin.include_role:
        name: hermes_deployment
      when: lookup('ansible.builtin.env', 'GITHUB_ACTIONS', default='false') | bool
