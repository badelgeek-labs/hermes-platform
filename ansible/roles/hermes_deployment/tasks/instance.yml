---
- name: Render Hermes Compose definition
  ansible.builtin.template:
    src: '{{ playbook_dir }}/templates/hermes-compose.yaml.j2'
    dest: '{{ hermes_platform_root }}/{{ hermes_instance.name }}/compose.yaml'
    owner: root
    group: root
    mode: '0644'
  become: true
  register: hermes_compose_definition

- name: Find the running Hermes container
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - --file
      - '{{ hermes_platform_root }}/{{ hermes_instance.name }}/compose.yaml'
      - ps
      - --quiet
      - --status
      - running
      - hermes
  become: true
  changed_when: false
  register: hermes_running_container_before

- name: Start or update the Hermes Compose project when needed
  ansible.builtin.command:
    argv: >-
      {{
        ['docker', 'compose', '--file',
         hermes_platform_root ~ '/' ~ hermes_instance.name ~ '/compose.yaml',
         'up', '--detach']
        + (['--force-recreate'] if hermes_instance.name in
           (hermes_runtime_changed_instances | default([])) else [])
      }}
  become: true
  when: >-
    hermes_compose_definition.changed or
    hermes_instance.name in (hermes_runtime_changed_instances | default([])) or
    hermes_running_container_before.stdout | length == 0
  register: hermes_compose_update

- name: Get the running Hermes container ID
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - --file
      - '{{ hermes_platform_root }}/{{ hermes_instance.name }}/compose.yaml'
      - ps
      - --quiet
      - --status
      - running
      - hermes
  become: true
  changed_when: false
  register: hermes_container_id
  when: hermes_compose_update.changed | default(false)

- name: Verify Hermes service is running
  ansible.builtin.assert:
    that:
      - >-
        (hermes_container_id.stdout if hermes_compose_update.changed | default(false)
         else hermes_running_container_before.stdout) | length > 0
    fail_msg: 'Hermes service is not running for instance {{ hermes_instance.name }}.'

- name: Inspect Hermes container mounts
  ansible.builtin.command:
    argv:
      - docker
      - inspect
      - --format
      - '{{ "{{" }} json .Mounts {{ "}}" }}'
      - >-
        {{ hermes_container_id.stdout if hermes_compose_update.changed | default(false)
           else hermes_running_container_before.stdout }}
  become: true
  changed_when: false
  register: hermes_container_mounts_raw

- name: Verify Hermes managed and runtime mounts
  vars:
    hermes_container_mounts: "{{ hermes_container_mounts_raw.stdout | from_json }}"
  ansible.builtin.assert:
    that:
      - >-
        hermes_container_mounts
        | selectattr('Source', 'equalto', hermes_managed_platform_root)
        | selectattr('Destination', 'equalto', '/mnt/hermes/platform')
        | selectattr('RW', 'equalto', false)
        | list | length == 1
      - >-
        hermes_container_mounts
        | selectattr('Source', 'equalto', hermes_data_root ~ '/' ~ hermes_instance.name ~ '-managed')
        | selectattr('Destination', 'equalto', '/mnt/hermes/' ~ hermes_instance.name)
        | selectattr('RW', 'equalto', true)
        | list | length == 1
      - >-
        hermes_container_mounts
        | selectattr('Source', 'equalto', hermes_data_root ~ '/' ~ hermes_instance.name)
        | selectattr('Destination', 'equalto', '/opt/data')
        | selectattr('RW', 'equalto', true)
        | list | length == 1
    fail_msg: >-
      Hermes mounts do not match the required platform, managed, and runtime
      paths for instance {{ hermes_instance.name }}.
