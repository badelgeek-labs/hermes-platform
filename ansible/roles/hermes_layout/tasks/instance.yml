---
- name: Create Hermes instance directories
  become: true
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - path: "{{ hermes_platform_root }}/{{ hermes_instance.name }}"
      owner: root
      group: root
      mode: "0755"
    - path: "{{ hermes_data_root }}/{{ hermes_instance.name }}"
      owner: "{{ hermes_user }}"
      group: "{{ hermes_group }}"
      mode: "0700"
    - path: "{{ hermes_data_root }}/{{ hermes_instance.name }}-managed"
      owner: "{{ hermes_user }}"
      group: "{{ hermes_group }}"
      mode: "0700"
    - path: "{{ hermes_data_root }}/{{ hermes_instance.name }}-managed/config"
      owner: "{{ hermes_user }}"
      group: "{{ hermes_group }}"
      mode: "0750"
    - path: "{{ hermes_data_root }}/{{ hermes_instance.name }}-managed/skills"
      owner: "{{ hermes_user }}"
      group: "{{ hermes_group }}"
      mode: "0750"
    - path: "{{ hermes_data_root }}/{{ hermes_instance.name }}-managed/plugins"
      owner: "{{ hermes_user }}"
      group: "{{ hermes_group }}"
      mode: "0750"
    - path: "{{ hermes_data_root }}/{{ hermes_instance.name }}-managed/workflows"
      owner: "{{ hermes_user }}"
      group: "{{ hermes_group }}"
      mode: "0750"
    - path: "{{ hermes_data_root }}/{{ hermes_instance.name }}-managed/scripts"
      owner: "{{ hermes_user }}"
      group: "{{ hermes_group }}"
      mode: "0750"
    - path: "{{ hermes_data_root }}/{{ hermes_instance.name }}-managed/templates"
      owner: "{{ hermes_user }}"
      group: "{{ hermes_group }}"
      mode: "0750"
    - path: "{{ hermes_data_root }}/{{ hermes_instance.name }}-managed/tests"
      owner: "{{ hermes_user }}"
      group: "{{ hermes_group }}"
      mode: "0750"
    - path: "{{ hermes_backups_root }}/{{ hermes_instance.name }}"
      owner: "{{ hermes_user }}"
      group: "{{ hermes_group }}"
      mode: "0700"

- name: Check whether Hermes managed components already contains a Git repository
  become: true
  become_user: "{{ hermes_user }}"
  ansible.builtin.command:
    argv:
      - git
      - -C
      - "{{ hermes_data_root }}/{{ hermes_instance.name }}-managed"
      - rev-parse
      - --git-dir
  check_mode: false
  changed_when: false
  failed_when: false
  register: hermes_managed_repository_probe

- name: Initialize Hermes managed components repository when absent
  become: true
  become_user: "{{ hermes_user }}"
  ansible.builtin.command:
    argv:
      - git
      - init
      - "{{ hermes_data_root }}/{{ hermes_instance.name }}-managed"
    creates: "{{ hermes_data_root }}/{{ hermes_instance.name }}-managed/.git"
  register: hermes_managed_repository_init
  when: hermes_managed_repository_probe.rc != 0

- name: Check whether the managed repository has an initial commit
  become: true
  become_user: "{{ hermes_user }}"
  ansible.builtin.command:
    argv:
      - git
      - -C
      - "{{ hermes_data_root }}/{{ hermes_instance.name }}-managed"
      - rev-parse
      - --verify
      - HEAD
  changed_when: false
  failed_when: false
  check_mode: false
  register: hermes_managed_repository_head

- name: List managed repository remotes before bootstrap
  become: true
  become_user: "{{ hermes_user }}"
  ansible.builtin.command:
    argv:
      - git
      - -C
      - "{{ hermes_data_root }}/{{ hermes_instance.name }}-managed"
      - remote
  changed_when: false
  when: hermes_managed_repository_head.rc != 0
  register: hermes_managed_repository_remotes

- name: Add initial ignore rules to an uncommitted managed repository
  become: true
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/templates/hermes-managed.gitignore"
    dest: "{{ hermes_data_root }}/{{ hermes_instance.name }}-managed/.gitignore"
    owner: "{{ hermes_user }}"
    group: "{{ hermes_group }}"
    mode: "0644"
    force: false
  when:
    - hermes_managed_repository_head.rc != 0
    - hermes_managed_repository_remotes.stdout_lines | default([]) | length == 0

- name: Create Hermes managed README when absent
  become: true
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/templates/hermes-managed-README.md"
    dest: "{{ hermes_data_root }}/{{ hermes_instance.name }}-managed/README.md"
    owner: "{{ hermes_user }}"
    group: "{{ hermes_group }}"
    mode: "0644"
    force: false

- name: Create Hermes managed agent instructions when absent
  become: true
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/templates/hermes-managed-AGENTS.md"
    dest: "{{ hermes_data_root }}/{{ hermes_instance.name }}-managed/AGENTS.md"
    owner: "{{ hermes_user }}"
    group: "{{ hermes_group }}"
    mode: "0644"
    force: false

- name: Keep Hermes managed directories in Git when empty
  become: true
  ansible.builtin.copy:
    content: ""
    dest: "{{ hermes_data_root }}/{{ hermes_instance.name }}-managed/{{ item }}/.gitkeep"
    owner: "{{ hermes_user }}"
    group: "{{ hermes_group }}"
    mode: "0644"
    force: false
  loop:
    - config
    - skills
    - plugins
    - workflows
    - scripts
    - templates
    - tests

- name: Define the managed repository bootstrap paths
  ansible.builtin.set_fact:
    hermes_managed_bootstrap_paths:
      - .gitignore
      - README.md
      - AGENTS.md
      - config/.gitkeep
      - skills/.gitkeep
      - plugins/.gitkeep
      - workflows/.gitkeep
      - scripts/.gitkeep
      - templates/.gitkeep
      - tests/.gitkeep

- name: List uncommitted managed repository files
  become: true
  become_user: "{{ hermes_user }}"
  ansible.builtin.command:
    argv:
      - git
      - -C
      - "{{ hermes_data_root }}/{{ hermes_instance.name }}-managed"
      - status
      - --porcelain
      - --untracked-files=all
  changed_when: false
  when:
    - hermes_managed_repository_head.rc != 0
    - hermes_managed_repository_remotes.stdout_lines | default([]) | length == 0
  register: hermes_managed_repository_status

- name: Determine whether the managed repository is safe to bootstrap
  ansible.builtin.set_fact:
    hermes_managed_bootstrap_safe: >-
      {{
        hermes_managed_repository_head.rc != 0 and
        (hermes_managed_repository_remotes.stdout_lines | default([]) | length == 0) and
        (
          (
            hermes_managed_repository_status.stdout_lines
            | map('regex_replace', '^.. ', '')
            | list
            | difference(hermes_managed_bootstrap_paths)
            | length
          ) == 0
        )
      }}
  when:
    - hermes_managed_repository_head.rc != 0
    - hermes_managed_repository_remotes.stdout_lines | default([]) | length == 0

- name: Stage the managed repository bootstrap files
  become: true
  become_user: "{{ hermes_user }}"
  ansible.builtin.command:
    argv:
      - git
      - -C
      - "{{ hermes_data_root }}/{{ hermes_instance.name }}-managed"
      - add
      - --
      - .gitignore
      - README.md
      - AGENTS.md
      - config/.gitkeep
      - skills/.gitkeep
      - plugins/.gitkeep
      - workflows/.gitkeep
      - scripts/.gitkeep
      - templates/.gitkeep
      - tests/.gitkeep
  changed_when: false
  when: hermes_managed_bootstrap_safe | default(false) | bool

- name: Check for staged managed repository bootstrap files
  become: true
  become_user: "{{ hermes_user }}"
  ansible.builtin.command:
    argv:
      - git
      - -C
      - "{{ hermes_data_root }}/{{ hermes_instance.name }}-managed"
      - diff
      - --cached
      - --quiet
  changed_when: false
  failed_when: false
  check_mode: false
  register: hermes_managed_bootstrap_staged_changes
  when: hermes_managed_bootstrap_safe | default(false) | bool

- name: Commit the managed repository bootstrap
  become: true
  become_user: "{{ hermes_user }}"
  ansible.builtin.command:
    argv:
      - git
      - -c
      - "user.name={{ hermes_managed_bootstrap_author_name }}"
      - -c
      - "user.email={{ hermes_managed_bootstrap_author_email }}"
      - -C
      - "{{ hermes_data_root }}/{{ hermes_instance.name }}-managed"
      - commit
      - --message
      - "{{ hermes_managed_bootstrap_commit_message }}"
  register: hermes_managed_bootstrap_commit
  when:
    - hermes_managed_bootstrap_safe | default(false) | bool
    - hermes_managed_bootstrap_staged_changes.rc == 1
