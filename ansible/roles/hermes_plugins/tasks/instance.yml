---
- name: Read enabled Hermes plugins
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - --file
      - '{{ hermes_platform_root }}/{{ hermes_instance.name }}/compose.yaml'
      - exec
      - --no-TTY
      - --user
      - '{{ hermes_runtime_uid }}:{{ hermes_runtime_gid }}'
      - hermes
      - hermes
      - config
      - get
      - plugins.enabled
      - --json
  become: true
  changed_when: false
  failed_when: >-
    hermes_enabled_plugins.rc != 0 and
    'Config key not set: plugins.enabled' not in hermes_enabled_plugins.stderr
  register: hermes_enabled_plugins

- name: Decode enabled Hermes plugins
  ansible.builtin.set_fact:
    hermes_enabled_plugins_list: >-
      {{ hermes_enabled_plugins.stdout | default('[]', true) | from_json }}

- name: Define Hermes platform plugin identifiers
  ansible.builtin.set_fact:
    hermes_platform_plugin_ids:
      - platform/discord-forum-posts
      - platform/discord-ui
    hermes_legacy_platform_plugin_ids:
      - discord-forum-posts
      - discord-ui

- name: Normalize enabled Hermes platform plugins
  ansible.builtin.set_fact:
    hermes_desired_enabled_plugins: >-
      {{
        (
          hermes_enabled_plugins_list
          | difference(hermes_legacy_platform_plugin_ids)
          + hermes_platform_plugin_ids
        ) | unique
      }}

- name: Enable Hermes platform plugins
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - --file
      - '{{ hermes_platform_root }}/{{ hermes_instance.name }}/compose.yaml'
      - exec
      - --no-TTY
      - --user
      - '{{ hermes_runtime_uid }}:{{ hermes_runtime_gid }}'
      - hermes
      - hermes
      - config
      - set
      - plugins.enabled
      - '{{ hermes_desired_enabled_plugins | to_json }}'
  become: true
  when: hermes_enabled_plugins_list != hermes_desired_enabled_plugins
  register: hermes_platform_plugins_configuration

- name: Read Discord forum-post gateway-injection permission
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - --file
      - '{{ hermes_platform_root }}/{{ hermes_instance.name }}/compose.yaml'
      - exec
      - --no-TTY
      - --user
      - '{{ hermes_runtime_uid }}:{{ hermes_runtime_gid }}'
      - hermes
      - hermes
      - config
      - get
      - plugins.entries.platform/discord-forum-posts.allow_gateway_injection
      - --json
  become: true
  changed_when: false
  failed_when: >-
    hermes_forum_posts_gateway_injection.rc != 0 and
    'Config key not set: plugins.entries.platform/discord-forum-posts.allow_gateway_injection' not in hermes_forum_posts_gateway_injection.stderr
  register: hermes_forum_posts_gateway_injection

- name: Decode Discord forum-post gateway-injection permission
  ansible.builtin.set_fact:
    hermes_forum_posts_gateway_injection_enabled: >-
      {{ hermes_forum_posts_gateway_injection.stdout | default('false', true) | from_json }}

- name: Allow Discord forum-post plugin to inject gateway messages
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - --file
      - '{{ hermes_platform_root }}/{{ hermes_instance.name }}/compose.yaml'
      - exec
      - --no-TTY
      - --user
      - '{{ hermes_runtime_uid }}:{{ hermes_runtime_gid }}'
      - hermes
      - hermes
      - config
      - set
      - plugins.entries.platform/discord-forum-posts.allow_gateway_injection
      - 'true'
  become: true
  when: not hermes_forum_posts_gateway_injection_enabled
  register: hermes_forum_posts_gateway_injection_configuration

- name: Read Discord UI gateway-injection permission
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - --file
      - '{{ hermes_platform_root }}/{{ hermes_instance.name }}/compose.yaml'
      - exec
      - --no-TTY
      - --user
      - '{{ hermes_runtime_uid }}:{{ hermes_runtime_gid }}'
      - hermes
      - hermes
      - config
      - get
      - plugins.entries.platform/discord-ui.allow_gateway_injection
      - --json
  become: true
  changed_when: false
  failed_when: >-
    hermes_discord_ui_gateway_injection.rc != 0 and
    'Config key not set: plugins.entries.platform/discord-ui.allow_gateway_injection' not in hermes_discord_ui_gateway_injection.stderr
  register: hermes_discord_ui_gateway_injection

- name: Decode Discord UI gateway-injection permission
  ansible.builtin.set_fact:
    hermes_discord_ui_gateway_injection_enabled: >-
      {{ hermes_discord_ui_gateway_injection.stdout | default('false', true) | from_json }}

- name: Allow Discord UI plugin to inject gateway messages
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - --file
      - '{{ hermes_platform_root }}/{{ hermes_instance.name }}/compose.yaml'
      - exec
      - --no-TTY
      - --user
      - '{{ hermes_runtime_uid }}:{{ hermes_runtime_gid }}'
      - hermes
      - hermes
      - config
      - set
      - plugins.entries.platform/discord-ui.allow_gateway_injection
      - 'true'
  become: true
  when: not hermes_discord_ui_gateway_injection_enabled
  register: hermes_discord_ui_gateway_injection_configuration

- name: Determine whether Hermes plugins changed
  ansible.builtin.set_fact:
    hermes_plugins_changed: >-
      {{
        (
          (hermes_platform_plugins_configuration.changed | default(false)) or
          (hermes_forum_posts_gateway_injection_configuration.changed | default(false)) or
          (hermes_discord_ui_gateway_injection_configuration.changed | default(false))
        ) | bool
      }}

- name: Restart Hermes gateway after plugin changes
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - --file
      - '{{ hermes_platform_root }}/{{ hermes_instance.name }}/compose.yaml'
      - restart
      - hermes
  become: true
  when: hermes_plugins_changed

- name: Verify required Discord plugin manifests are enabled
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - --file
      - '{{ hermes_platform_root }}/{{ hermes_instance.name }}/compose.yaml'
      - exec
      - --no-TTY
      - --user
      - '{{ hermes_runtime_uid }}:{{ hermes_runtime_gid }}'
      - hermes
      - hermes
      - plugins
      - list
  become: true
  changed_when: false
  register: hermes_plugins_list
  failed_when: >-
    'discord-forum-posts' not in hermes_plugins_list.stdout or
    'discord-ui' not in hermes_plugins_list.stdout
